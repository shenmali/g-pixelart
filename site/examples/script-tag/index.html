<div class="demo-area">
  <div class="row" id="out"></div>
</div>

<script src="../../lib/g-pixelart.min.js"></script>
<script>
  // The global is Pixelart. The script is served from this site's lib/ directory.
  const img = new Image();
  img.src = '../../assets/samples/still-life.svg';
  img.onload = async () => {
    // The short pixelate call returns a canvas.
    const canvas = await Pixelart.pixelate({
      image: img,
      width: 96,
      dither: 'Floyd-Steinberg',
      strength: 60,
      palette: ['#1b1b1e', '#f4f1de', '#e07a5f', '#3d405b', '#81b29a', '#f2cc8f', '#8d5a97', '#ef3054'],
      resolution: 'original',          // 'original' scales back up to the source size, 'pixel' keeps it small
    });
    canvas.className = 'out';
    const fig = document.createElement('figure');
    fig.append(canvas);
    const cap = document.createElement('figcaption');
    cap.textContent = `${canvas.width} × ${canvas.height} canvas`;
    fig.append(cap);
    document.getElementById('out').append(fig);
  };
</script>
